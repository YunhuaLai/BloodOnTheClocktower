  暮色小镇迎来了新一批外来者，你们带来了繁荣，也带来了瘟疫。在这场浩劫之中，有人偷窃封印恶魔的圣杯，而有人戴上了古老的面具而迷乱。有人自发组建邪教去猎杀外来者，因为他们相信外来者的死亡会终结这场浩劫，而有人在角落里传播瘟疫。[特别感谢画师：叶陌上、Lei、云乡子]
