author: The Pandemonium Institute
logo: https://oss.gstonegames.com/static/image/team/202206/c_1745145915561_f3303786.jpg
description: >-
  冬日的暮色渐近，太阳被盘陀的天际线所吞噬，橙红的枫叶被黑色斑点逐渐侵蚀，森林无声地期待着雪花将至。<br><br>小镇边缘的岩隙深处传来阵阵饿狼的嚎叫，受惊的鸦群从舒适的栖身之处四散而逃。旅行者们匆匆步入旅店，试图回避渐增的刺骨寒意。众人靠着温热的茶水、悠扬的乐曲和浓烈的麦酒来暖和身子，却浑然不觉一双双怪异而邪恶的眼睛正向他们悄然逼近。<br><br>众生皆知，今夜将有……<br><br>黯月初升。
townsfolkName: 镇民
additional:
  - 剧本介绍: >-
      《黯月初升》是一场死亡盛宴。<br><br>恶魔每晚能多次杀人，爪牙也会参与其中。善良玩家能冒着巨大风险来获得可靠的信息，但在这过程中也可能会意外杀死自己的朋友。幸运的是，游戏中有着多种方式能让命数已尽的玩家保持存活。然而，如果善良阵营无法确定有哪些爪牙和恶魔在场，那么一切都将迈向毁灭的深渊。<br><br>难度：中等。推荐给积极主动、善于合作、不惧死亡的玩家游玩。<br><br>在玩《黯月初升》时……<br><br>善良玩家如果消极被动，几乎无法获取信息。某些镇民的能力需要善良阵营来处决玩家以获得信息（例如茶艺师和和平主义者），而其他的能力则鼓励善良玩家冒着死亡的风险来确定玩家的身份（例如赌徒和造谣者）。只要善良玩家行动起来，他们就会得知相应的信息。<br><br>善良阵营也需要高度关注谁在夜晚死去了，以及死亡的原因。如果善良玩家忽略了这一点，就很有可能在还有四名、五名甚至六名玩家存活的情况下，意外落败。不过，如果他们能够厘清在夜晚死亡的每名玩家都是因何而死，就能弄清有哪些邪恶角色在场，以避免因为可怕的主谋或是骇人的珀而输掉游戏。同时，他们还能获得有用的线索来确定哪些善良角色意外杀死了哪些玩家（例如月之子和修补匠）。<br><br>邪恶玩家可能一开始觉得己方所向披靡，但是为了获胜，他们需要精准且谨慎地使用自己的能力。恶魔可能需要说服善良阵营相信场上是另一种类的恶魔，来避开某些能对自己造成毁灭性打击的善良角色（例如驱魔人和侍臣）。并且恶魔可能需要通过故意不杀人来佐证自己的观点。但是如果恶魔能确定应该攻击谁、不应该攻击谁（例如茶艺师的邻近玩家，以及弄臣），那善良阵营就有大麻烦了。<br><br>爪牙需要把握好使用能力的时机。发动了适时刺杀的刺客，沉得住气的魔鬼代言人，或是看透人心的主谋，都足以让邪恶阵营反败为胜。
