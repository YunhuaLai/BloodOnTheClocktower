description: >-
  生机勃勃的春天已然过去，温暖迷人的夏天悄然来临。园丁在公园和窗栏上精心培育，让百花齐放，一望无际。鸟儿在歌唱，艺术家们拿起了画笔，哲学家在熙熙攘攘的酒馆里思索人生的终极奥秘，城镇周围搭建起老旧的帐篷预示着马戏团即将开启。<br><br>在人们沉湎于纸醉金迷和灯红酒绿时，黑暗势力却悄然崛起。女巫和异教徒们潜藏在郊区的宏伟遗迹之间，在地下洞穴中密谋着渗透城镇，而那在宴会中狂欢的鸦木布拉夫居民们却浑然不知。<br><br>良辰已至……<br><br>梦殒春宵。
townsfolkName: 镇民
additional:
  - 剧本介绍: >-
      《梦殒春宵》是前三个剧本套装中最疯狂的一个。善良的角色每晚都能得到惊人的信息。然而，邪恶阵营能够带来的威胁也多种多样，并且可以制造巨大的混乱。角色能力会让阵营发生变化，而玩家的角色也会发生变化。甚至是邪恶阵营也会在游戏中晕头转向，敌我不分。这也是疯狂机制第一次出现在游戏中，它为游戏增添了新的变数。<br><br>难度：中等。推荐给狂野的、想要游戏充满惊喜的玩家，以及想要挑战极限伪装和虚张声势的玩家。<br><br>在游玩《梦殒春宵》时……<br><br>善良玩家拥有的信息量几乎超过了他们能够处理的极限，与《暗流涌动》不同，《暗流涌动》中的善良阵营大部分时间都可以相信他们获取的大部分信息，而《梦殒春宵》中的善良阵营需要弄清楚哪个恶魔存在于游戏中，才能开始明白到底发生了什么。<br><br>当方古在游戏中时，寻找恶魔就变成了追逐战，因为它随时可能转移到一名毫无戒心的外来者身上，逃离尘埃遍布的小镇。当诺-达鲺在游戏中时，会有两名镇民中毒，但是如果善良阵营能够推断出是哪两名镇民中毒，他们就能借此机会找到恶魔。当亡骨魔在游戏中时，如果爪牙在夜晚死亡，镇民会中毒。当涡流在游戏中时，所有的信息都是错误的。一旦善良阵营察觉到哪些信息是正确的，哪些信息是错误的，他们就可以追溯并扭转他们曾以为清楚明白的事情，并重新审视那些有价值的信息。<br><br>让局面更加混乱的是，在游戏的大部分时间里，外来者通常会隐瞒和伪装自己的角色。甚至可能某些镇民也会这么做。一名外来者的死亡可能为善良阵营带来巨大的劣势，所以，聪明的恶魔通常会想尽快杀死他们。<br><br>邪恶玩家会想要尽快杀死或者以其他方式消除最危险的镇民带来的威胁。恶魔每晚只能发起一次攻击，但是爪牙们如果很聪明的话，诸如麻脸巫婆、女巫、洗脑师，都能够协助消灭善良阵营的玩家。邪恶玩家们还应该考虑向其他玩家提供正确还是错误的信息，因为其他玩家可能会根据这些信息，针对他们认为存在的恶魔种类进行一场反向推理。
