description: >-
  常走偏门捞阴钱，不仅五弊三缺，更是晦气深重，终究还是被酆都盯上，派出阴差拘魂索命。阴阳眼、说书人、扎纸匠、摘星手、搬山寻龙、百里行走齐聚氓阴镇，只为求得一线生机。只是，关外的邪魔蠢蠢欲动，动乱的时局渐迷人眼，能否成功将阴神送走，尚不可知...
