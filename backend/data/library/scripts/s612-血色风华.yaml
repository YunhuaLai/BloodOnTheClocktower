description: >-
  凛冬将至，小镇钟楼上降临了一位神秘的往生者。传说中，往生者拥有参破阴阳的能力，了解世间一切秘传。为了与其相见，镇民们于黎明之际齐聚钟楼。黄昏之际，血色迷雾笼罩长街，判决者高举利斧，织女的罗裙染上一抹赤红……鸦声呜咽，亡语低吟，而钟楼看守者封印恶魔的钥匙，不翼而飞。
