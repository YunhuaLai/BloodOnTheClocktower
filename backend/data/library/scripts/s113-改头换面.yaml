description: |-
  “晓去龙华三半两， 归时香烬满炉装。九叩默祷万事愿，则灵无处不庙堂。”
  随着说书先生的声音戛然而止，众人还在讨论着刚刚的故事，只是众人都意识到似乎已经听了很多个故事。
  再次抬头，发现说书先生早已不见踪影，门外是怪物的嘶吼声，而周围的人脸上都戴上了奇怪的面具。
  他们是谁？你又是谁？
