en: 诡镇疑云
author: 木木木
logo: https://free.picui.cn/free/2025/11/28/69289f128cc05.png
description: >-
  行走在铺满鹅卵石的街道上，目之所及人迹罕至，偶尔有身披呢子大衣头戴宽檐礼帽的路人低着头匆匆路过。路旁钢铁围栏后方的老旧建筑中不时传出骇人惨叫，不远处的河水在这无风之日诡异地翻腾着。锈迹斑斑的路牌揭示了真相，此地并非鸦木布拉夫小镇。“号外！号外！密斯卡托尼克大学昨夜失窃！数名教授离奇失踪！先生们女士们，要来一份《阿卡姆日报》吗？”报童摇晃着手中的报纸，不知从何处突然现身。报纸头版满是骇人听闻的怪异之事——莫名的失踪、离奇的死亡、神秘的集会……无数的线索都指向了某个事实——黑暗的阴影已经逐渐笼罩了阿卡姆，不可名状的邪神及其爪牙潜伏在小镇上，于时间与空间的缝隙之中伺机而动。镇民们能否够抵抗住远古邪神对理智的侵蚀，同时阻止自己的家园迈向那无法回避的毁灭终局？谣言四起，恐惧蔓延，何人能解……诡镇疑云？
