description: >-
  乌云在鸦木布拉夫的天空中翻滚着，让这个沉睡中的小镇和迷信的居民们笼罩在不祥的阴影之中。刚洗过的衣物在屋舍间的细绳上诡异地起舞。烟囱向外吐出滚滚的浓烟。<br><br>坩埚在角落里悄悄地冒着泡，混杂着奇异的气味从窗户和门缝中飘散开来。一股不寻常的秋日暖风环绕着藤蔓覆盖的墙壁，向那些敢于行走在鹅卵石街道上的人们发出不祥的低语。<br><br>当远处的地平线上雷声响起时，焦虑的母亲们把玩耍中的孩子唤回家中。然而，如果你再仔细聆听，仍然可以听见近处森林里的诡异回声。远处一座隐约可见的修道院里，有人影在一道道门洞间穿行。<br><br>只有那些读懂迹象的人，才能明白，有什么正在……<br><br>暗流涌动。
townsfolkName: 镇民
additional:
  - 剧本介绍: >-
      在《暗流涌动》中，每种要素都会略有涉及。一些角色会被动地获取信息，一些角色则需要通过行动来得知谁是谁，而一些角色则单纯只是想诱使恶魔攻击他们。善良与邪恶双方都可以适时做出牺牲以占据上风。<br><br>《暗流涌动》是一场对恶魔长驱直入的狩猎，然而邪恶方也有一连串混淆信息的卑鄙把戏。所以如果善良玩家想要求得生存，最好先质疑自己原本的认知。<br><br>难度：初学者。推荐给那些初学《染》和这类社交推理游戏的玩家及说书人。<br><br>当你游玩《暗流涌动》时……<br><br>善良玩家需要运用逻辑与直觉来分辨正邪。一些玩家或许想要立马揭露自己的角色，并分享得到的信息（例如厨师和调查员），而另一些玩家则想对自己的身份撒谎来让小恶魔——本剧本中的恶魔——不去攻击他们（例如送葬者和占卜师）。有的玩家会用谎言掩盖自己的角色，以使小恶魔来攻击他们（例如守鸦人和士兵）！<br><br>一些其他的善良角色通过使用能力并观察效果来获取信息。通过提名贞洁者来牺牲某人的性命，试图杀死恶魔的猎手，以及静待事情发生或刻意处决善良玩家来判断他人角色的送葬者——这些都是牺牲生命与力量来获取信息并走向胜利的方式。<br><br>邪恶玩家需要伪装成善良玩家，必要时还要给出错误的信息来迷惑善良阵营。如果只有正确信息，善良阵营会有足够充裕的时间来寻找邪恶玩家。但仅仅只是一点能被相信的谎言，也会使邪恶一方有机可乘。投毒者和间谍如果稍加注意，便能巧妙地使用自己的能力在善良阵营中制造巨大的混乱。邪恶一方也需要决断何时做出牺牲。红唇女郎会杀死恶魔来拯救自己的阵营么？小恶魔会自杀来使一位更可信的玩家成为恶魔么？邪恶阵营会投票处决一位可疑的爪牙，来让自己显得像小镇里最正直的一员么？
