description: >-
  歌舞生平，佳节已至。<br>欢乐的气氛笼罩着整个鸦木布拉夫镇子。热闹的音乐和欢笑声，四处飘来的酒香，舞狮人热闹的表演，飘扬在空中的红灯笼和彩旗。<br>可是，在这个喜庆的日子里，染红衣裳的可不只是灯笼的红光。在庆祝活动的高潮时刻，一名年轻男子在人群中倒下，鲜血从他的胸口喷涌而出。恐慌和混乱瞬间席卷整个镇子，镇民四处奔逃。<br>据目击者称，嫌疑人是一名黑衣男子，在人群中悄悄离开但是黑衣男子仍然在逃。<br>尽管如此，镇子的居民们还是决定继续庆祝春节，坚定地相信镇民会尽快绳之以法。<br>然而，这件可怕的事件让整个镇子笼罩在不安和不祥的气氛之中……
