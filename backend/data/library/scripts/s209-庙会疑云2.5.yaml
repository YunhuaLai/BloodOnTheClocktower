description: |-
  热闹的庙会、无头的城隍，是谁将阴神亵渎？
  诡谲的现场、无知的信众，又是谁将众人裹挟？
  转动的齿轮、炙热的蒸汽，远洋而来的异族到底是何居心？
  祥和的庙会下早已暗流涌动，动乱的大幕正在缓缓拉开，到底谁能在这场风波中笑到最后，尚不可知......
