description: >-
  来自于官方第四个大型剧本《游园惊梦》的利维坦虽然早就被设计了出来，但是却因为后续剧本的长期测试而难以在测试人员之外的玩家群体中带来乐趣。因此在一个闲暇的午后，几位设计师闲聊时决定要为利维坦这个有趣的恶魔设计一个专门的小型剧本，经过一段时间的测试和修改，这个逻辑缜密，受人喜爱的小型剧本就诞生了。<br><br>一开始此剧本的难度被定为5级，不过随着《凶宅魅影》的逐渐完善，Steven直言没有一个剧本能比我的《凶宅》难，于是《窃窃私语》的难度便下调为了4级。
townsfolkName: 镇民
additional:
  - 剧本介绍: 我把这个剧本推荐给擅长逻辑，喜欢和平，积极探索可能性的玩家，值得一提的是，此剧本对于说书人的要求极高，由于渔夫，学者，追忆者这样高自由度的角色能力，平衡性的把控非常考验说书人的水平！
