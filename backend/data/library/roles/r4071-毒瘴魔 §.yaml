firstNightReminder: >-
  Each night, wake the Miasma. They either shake their head no or nod yes. If they shake their head, put the Miasma to
  sleep. If they nod, place the “Shrouded” reminder in the Grimoire, and mark the Miasma with “No ability”. While the
  “Shrouded” reminder is placed, all Townsfolk are poisoned, and additionally must receive false information if they get
  any information.
