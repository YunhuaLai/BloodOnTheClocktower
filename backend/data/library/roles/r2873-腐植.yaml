otherNightReminder: >-
  在腐植的角色标记旁放置“+1”提示标记。如果腐植的腐蚀程度大于2，唤醒腐植，让他选择一个不在场的恶魔角色和一名玩家，让他重新入睡。随后用该恶魔角色标记替换腐植角色标记，用腐植角色标记替换该玩家的角色标记，唤醒该玩家，为他展示“他的能力对你生效”信息标记和腐植角色标记，用大拇指向下表示他转变为邪恶阵营。
ability: 每个夜晚，你会腐蚀+1。如果你的腐蚀大于2，当晚你要选择一个不在场的恶魔角色和一个玩家：你变成该恶魔，他变成邪恶的腐植，但每局游戏仅能成功转化一次。
