flavor: >-
  It started with one exiled man, yes that is true. But one man presumed dead quickly turned into two. And once there
  was three then it became a crowd. Who rued the fourth man, for he screamed so loud. The fifth man was lonely, had the
  crowd worried sick. So all the soiled men cheered when they threw down the sixth. Crushing the seventh man's head, the
  eighth man cried. "More bodies in the pit!" as they tossed in number nine.
