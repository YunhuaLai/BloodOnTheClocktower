ability: 本游戏设有两个独立的城镇广场，每个夜晚说书人通过投票会宣布下个夜晚和下个白天进行游戏的城镇。玩家在两个城镇广场的阵营和生死是互通的且只能在对应的城镇发动对应的技能。当场上存活三名及以下的玩家且恶魔存活时邪恶阵营胜利。
