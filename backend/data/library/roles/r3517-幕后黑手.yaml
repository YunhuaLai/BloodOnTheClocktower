firstNightReminder: >-
  唤醒幕后黑手，给他指出恶魔当晚选择的玩家。如果他点头，为他放置化身为魔标记，将他的角色标记替换为那个善良角色标记，并为他放置恶魔提示标记（可以与当前恶魔不同）。向他展示“你是”提示卡，并展示一个善良角色。。移除当前恶魔的恶魔提示标记。如果幕后黑手变为二重身，他会得知一个在场的善良角色，并且他与那个在场善良角色的玩家都变为二重身。
otherNightReminder: >-
  唤醒幕后黑手，给他指出恶魔当晚选择的玩家。如果他点头，为他放置化身为魔标记，将他的角色标记替换为那个善良角色标记，并为他放置恶魔提示标记（可以与当前恶魔不同）。向他展示“你是”提示卡，并展示一个善良角色。移除当前恶魔的恶魔提示标记。如果幕后黑手变为二重身，他会得知一个在场的善良角色，并且他与那个在场善良角色的玩家都变为二重身。
ability: 每个夜晚，你可以选择变为恶魔。如果你变为恶魔，当前的恶魔玩家会变为他自以为的善良角色。你会得知恶魔每晚选择的玩家。
