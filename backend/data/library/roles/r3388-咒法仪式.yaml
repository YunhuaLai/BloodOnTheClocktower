firstNightReminder: >-
  Cast Spells in the order they were drawn even if those players died tonight. Remove any "Ongoing Effect" tokens from
  dead players or those who cast a new spell. Place a "Cast" token on each player whose spell was successfully cast (or
  a "Dud" token if vetoed). Place an "Ongoing Effect" token on any player whose cast spell includes a lasting effect.
otherNightReminder: >-
