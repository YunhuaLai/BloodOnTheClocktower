ability: >-
  每个夜晚，等同于施法上限数量的咒语将被抽取然后施放。[初始为玩家总数的1/3，向下取整]说书人可以将任何被抽中的咒语变为失去效果的哑咒。具有持续效果的咒语需要“施法专注”，如果另外一条此类的咒语被施放则前一个咒语的效果终止。每个黎明，被施放的咒语的名称会被公布。
