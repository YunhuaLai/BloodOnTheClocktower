firstNightReminder: >-
  Wake the Musician. They will choose 2 players. If the 1st will wake before the 2nd due to their own abilities, nod at
  the Musician & show them a finger signal for how many are good. If the Musician is evil, mark them both with the
  Musician's POISONED reminder. Then, put the Musician to sleep.
otherNightReminder: >-
  Remove any active Musician POISONED reminders. Wake the Musician. They will choose 2 players. If the 1st will wake
  before the 2nd due to their own abilities, nod at the Musician & show them a finger signal for how many are good. If
  the Musician is evil, mark them both with the Musician's POISONED reminder. Then, put the Musician to sleep.
ability: 每个夜晚*，你要选择一名玩家和一个角色：如果他的角色类型与你选择的角色对应的角色类型相同：他变成你选择的角色。如果你选择了一名邪恶玩家：他会得知你选择的角色。
