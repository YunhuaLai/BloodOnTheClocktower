ability: >-
  【诡诈杰克意味着有两名说书人】当玩家因角色能力获取信息时，其中一位说书人提供正确信息，另一位提供错误信息。每次需要获取信息时，玩家自行选择由哪位说书人来告知，在涉及游戏规则或非角色能力信息时，说书人始终必须说真话。每局游戏限一次，通常在善良阵营逐渐分辨出真假说书人时，说真话的说书人可以变为说假话的，反之亦然。
