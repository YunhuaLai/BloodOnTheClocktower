ability: >-
  在游戏开始时，说书人要决定每个“漫游”标记的移动方向（顺/逆时针，每名角色一个)。善良角色的“漫游”标记初始不会在对应角色上，而邪恶角色的“漫游”标记初始在自己身上。每个夜晚*，“漫游”标记会沿设置好的方向移动1格（除非另有说明)。镇民角色和邪恶角色的“漫游”标记会在移动时跳过死亡玩家与邪恶玩家。外来者角色和旅行者的“漫游”标记在移动时只会跳过死亡玩家。
