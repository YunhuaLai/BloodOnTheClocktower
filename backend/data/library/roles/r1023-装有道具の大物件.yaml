ability: >-
  在游戏开始前，说书人会准备5个笨重的大物件，其中有4个笨重的大物件装有'道具'。每个夜晚，说书人将取出所有'道具'，再将'道具'随机放入笨重的大物件中。每个白天，当隐士/大象首次手持装有'道具'的笨重的大物件后，会触发该'道具'所对应的技能，且每个'道具'所对应的技能每局游戏仅触发一次。不能在提名阶段手持与上个玩家相同的笨重的大物件。
