firstNightReminder: >-
  Wake up the Inquisitor and have them select a player. Put the 'Chosen' token next to that player and then show the
  Inquisitor that player's character token. :reminder:
otherNightReminder: >-
  Wake up the Inquisitor and point to the 'chosen' player. If the Inquisitor then nods, kill that player. Otherwise,
  allow them to select a different player to die and place the 'Once' token next to the Inquisitor and do not repeat
  this step again. Have the Inquisitor select a new player and put the 'Chosen' token next to that player and then show
  the Inquisitor that player's character token. :reminder:
