ability: >-
  每个黄昏如果有玩家被处决死亡，该玩家要在剩余的存活玩家中选出一名玩家，被选择的玩家需要再选择一名存活玩家，直到共选出3名玩家。被选择的玩家一起做任务。不可有两次任务由相同的三名玩家参与，同一玩家只能连续参与两次任务。 
  做任务的玩家黄昏时会被分别唤醒并要选择在任务中【工作】【破坏】或【摸鱼】。如果有玩家进行了破坏，或三名玩家都在摸鱼，则该任务失败。
