firstNightReminder: >-
  Each night, wake the Conductor. They choose up to 2 players -- Mark chosen evil players with the "Alerted" reminder.
  For each Townsfolk or Outsider player chosen, which isn't the Conductor (or a player already chosen), move the "Train"
  reminder one step clockwise. Put the Conductor to sleep. Wake all players with the "Alerted" reminder (separately).
  Show them the "This player is" info token and show them the Conductor character token, and point to the Conductor.
  Remove the "Alerted" reminder and put them to sleep.
