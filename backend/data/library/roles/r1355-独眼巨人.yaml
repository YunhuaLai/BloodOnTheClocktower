remindersGlobal: []
firstNightReminder: >-
  唤醒独眼巨人，让他选择一名玩家。向独眼巨人展示该玩家的角色标记，然后让独眼巨人重新入睡。唤醒一名恶魔，向恶魔展示角色标记，然后指向那名玩家，让恶魔重新入睡。如果当晚独眼巨人选择的是一名外来者，再唤醒该外来者，向他展示独眼巨人角色标记（或告知他独眼巨人在场），然后让这名玩家入睡。
otherNightReminder: >-
  唤醒独眼巨人，让他选择一名玩家。向独眼巨人展示该玩家的角色标记，然后让独眼巨人重新入睡。唤醒一名恶魔，向恶魔展示角色标记，然后指向那名玩家，让恶魔重新入睡。如果当晚独眼巨人选择的是一名外来者，再唤醒该外来者，向他展示独眼巨人角色标记（或告知他独眼巨人在场），然后让这名玩家入睡。
ability: 每个夜晚，你要选择一名玩家：你和恶魔会得知他是什么角色。被你选择的外来者会得知独眼巨人在场。[+1外来者]
