ability: >-
  照看小怪宝的爪牙会有额外的能力，小怪宝在玩家间传递超过一次后会死亡，忽略最后一天只剩一名爪牙存活的限制。继位：因爪牙死亡而将小怪宝传递给你不计入传递次数，你拥有那名爪牙的额外能力。刺杀：由你来决定谁会被小怪宝杀死。八爪：与你临近的两名镇民中毒，即使你中毒。专权：外来者可能会被善良玩家当作邪恶的爪牙。傀儡：会有一名善良玩家把你当作善良阵营和善良角色。
