ability: 每个夜晚*，你可以选择三名存活玩家（所有玩家都会得知你选了谁）：第一名玩家在其他两名玩家中秘密选择一名玩家，他死亡，然后另一名玩家秘密决定他是否被你杀死，如果他存活则被他选择的玩家秘密决定另一名玩家是否被你杀死。
