ability: |-
  游戏开始前，说书人要决定哲学家能否选择阴影善良角色。

  阴影角色[魔术师，半兽人，刺客，麻脸巫婆，暴风捕手]不会在游戏开始时加入。

  游戏开始前，说书人会公开宣布本局游戏的寿星是谁，寿星不会是恶魔。

  夜晚时，寿星可以吹灭于与自己(认知)阵营颜色相同的蜡烛(每局游戏限3次),白天说书人会公布第几根蜡烛被吹灭。
