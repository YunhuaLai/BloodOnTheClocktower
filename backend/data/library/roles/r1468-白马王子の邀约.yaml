ability: >-
  游戏初始设置邪恶玩家的总数最多能比初始设置多一名。每个白天限一次，一名存活玩家可以公开邀请另一名存活玩家一同拜访说书人(与之前不同)，说书人会给他们一个需共同完成的任务：直到当天黄昏，如果两名玩家阵营相同且完成了该任务，当晚他们中的其中一名玩家会获得一条正确信息；如果两名玩家阵营不同且完成了该任务，当晚他们中的善良玩家会获得一条错误信息；如果该任务没有完成，则不会获得任何信息。
