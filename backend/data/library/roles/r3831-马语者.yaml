remindersGlobal: []
firstNightReminder: >-
  Wake the Horse Hearer. They point at a player -- Mark them with the "Drunk" reminder token, they are drunk. Put the
  Horse Hearer to sleep. Wake the chosen player. Show them the "This character selected you" info token, and then the
  Horse Hearer character token. They will either nod or shake their head. If they shake their head, they are no longer
  drunk -- remove the "Drunk" reminder token. Put them to sleep. Wake the Horse Hearer. Show them what the chosen player
  did (so if they shook their head, you then shake yours). Put the Horse Hearer to sleep.
otherNightReminder: >-
