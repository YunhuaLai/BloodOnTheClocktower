firstNightReminder: >-
  Each night, wake the Loom weaver. They will either shake their head, or point to 2 players. If they point to 2
  players, mark the Loom Weaver with the "Once" reminder token. If they already have this reminder token, mark them with
  the "No Ability" reminder token. If those 2 players are of the same alignments, swap their character tokens and mark
  both with the "Swapped" reminder tokens. Put the Loom Weaver to sleep. If the Loom Weaver has the "No ability"
  reminder token, remove their night token from the night sheet.
