ability: >-
  每个夜晚*，你可以拍照，然后可以使最多三名玩家进入共计三次受伤状态，并可以选择至多2名倒地状态的玩家使其进入濒死状态（此次濒死状态不算在两次濒死状态中）。
  白天后，你拍的照片撕毁，所有当晚因你处于濒死状态的人会变成倒地状态，所有当晚因你处于倒地状态的人会变成受伤状态，所有当晚因你处于受伤状态的人会处于隐伤状态。
  如果不拍照，则选择一名玩家，并使其进入受伤状态或者选择一名已倒地的玩家，使其进入濒死状态。
