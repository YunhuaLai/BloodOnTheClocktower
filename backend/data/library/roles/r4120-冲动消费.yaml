ability: >-
  ①游戏开始时，每名玩家拥有7枚金币（玩家之间不能交易金币）。②每个白天，说书人会拍卖一项能力（该能力可以不在剧本上），玩家在白天可以秘密出价，最高且唯一出价者获得该能力直到下个黎明，即使他死亡，且不受醉酒/中毒影响。③善良玩家出价消耗的金币不会返还，邪恶玩家在出价中与其他玩家平局时会返还金币。成功拍得能力的玩家会被秘密告知。
