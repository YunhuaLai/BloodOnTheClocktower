ability: >-
  1、属性：游戏开始时，每个玩家随机获知自己的属性(1、0),不同属性的玩家人数相差不会超过1人 (即1、0各一半),属性如果发生变化会秘密得知。
  2、约会：每个白天每名存活玩家可以参与一次约会，每次约会最少需要两名存活玩家。如果本次约会中，同时存在1、0属性，且参与者均清醒且健康，会公开得知约会成功，否则得知失败。
  3、满地飘零：除了常规获胜条件以外，当场上存活玩家属性只剩下1或者0时，邪恶阵营获胜。
