otherNightReminder: >-
  唤醒鹿野院平藏，让他指向除他以外的一名玩家，将鹿野院平藏的「得知」标记放在他选择的玩家角色的标记旁边。让鹿野院平藏入睡。如果被鹿野院平藏选择的玩家或與他鄰近的玩家死於惡魔的能力，唤醒鹿野院平藏並告訴他那些死亡玩家和鄰近的存活玩家之中是否有執行官，让鹿野院平藏重新入睡。如果鹿野院平藏使用了能力，请在他的角色旁边放置一个「失去能力」标记且之後無須為了發動能力而喚醒他。
ability: 每局游戏限一次，在夜晚時*，你可以选择一名玩家。如果他或与他邻近的存活玩家被惡魔殺死，你會得知該玩家与他邻近的存活玩家之中是否有執行官。
