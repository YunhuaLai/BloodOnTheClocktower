firstNightReminder: 在你的首个夜晚，你要选择一名玩家：他中毒并获取错误信息，且会被视为邪恶的沙魔。 随后每个夜晚，该能力会顺时针移动至下一位存活镇民玩家，直至其死亡。 当因你中毒的玩家死亡，你重获能力，随后会有一名善良玩家得知此事。
