firstNightReminder: >-
  The Cryomancer either shakes their head or points to a character on their sheet. If the chosen character is in play,
  they are poisoned -- Mark them with one of the "Poisoned" reminder tokens. Put the Cryomancer to sleep. If the player
  marked "Frozen" is alive, wake them. Show them the "This character selected you" info token, and then the Cryomancer
  character token. Then, show them the character token of the character the Cryomancer pointed to. Put them to sleep.
  Put them to sleep. If the Cryomancer didn't choose a character tonight, don't wake the player marked "Frozen".
