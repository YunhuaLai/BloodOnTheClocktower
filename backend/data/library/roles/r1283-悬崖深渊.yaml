  悬崖深渊选择三名存活玩家。对所有人宣告第一名玩家，然后唤醒他并让他秘密决定后两名玩家是否一同被杀死，如果后两名玩家存活则对所有人宣告第二名玩家，然后唤醒他并让他秘密决定第三名玩家是否被杀死，如果第三名玩家存活则对所有人宣告第三名玩家，然后唤醒他并让他秘密决定自己是否被杀死。如果结算完所有玩家的决定后三名玩家都存活，他们都死去。
ability: 每个夜晚*，你可以选择三名存活玩家（所有玩家都会得知谁仍然存活）：他们中的存活玩家分别秘密决定后续玩家（或自己）是否被你杀死，然后如果他们都存活则都死亡。
