rule: >-
  如果受盲从能力影响的两名玩家之一没有获得更高票数，盲从可以导致受到他的能力影响的两名玩家同时被处决；如果这两名玩家之一被提名且获得更高票数(而另一个未被提名)，优先处决该玩家；如果有第三名或更多玩家得到了相等的票数，不会因此导致他(们)和受到盲从能力影响的玩家同时被处决。
