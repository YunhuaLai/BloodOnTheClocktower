terms:
  - id: day
    name: 白天
    aliases:
      - 白昼
      - 白天阶段
    category: 流程
    summary: 玩家公开讨论、提名、投票和处决的主要阶段。
    detail:
      overview: 玩家公开讨论、提名、投票和处决的主要阶段。
      howItWorks:
        - 白天是全桌共享信息和制造压力的时间。
        - 提名、辩解、投票、处决通常都在白天完成。
        - 死亡玩家仍然可以发言，但只剩一次有效投票。
      commonMistakes:
        - 把白天只当作聊天时间，忘记用提名和投票创造信息。
        - 过早结束讨论，导致夜晚信息无法被交叉验证。
        - 死亡玩家忘记自己还能参与发言。
      examples:
        - 可以在关联角色的详情页里看到这个关键词如何影响实际局面。
