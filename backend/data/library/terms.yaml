      howItWorks:
        - 首夜通常用于确认初始配置、开局信息和邪恶方互认。
        - 开局信息不等于绝对真相，仍可能受到角色效果影响。
        - 说书人需要提前准备好首夜顺序和要给出的信息。
      commonMistakes:
        - 开局信息一出就直接定死身份。
        - 忘记部分角色只在首夜行动。
