      howItWorks:
        - 中毒玩家一般不知道自己中毒。
        - 中毒会让信息、保护、击杀或其他能力出现异常。
        - 中毒不是说玩家变成邪恶，而是能力层面出了问题。
      commonMistakes:
        - 看到矛盾信息就把玩家直接打成邪恶。
        - 以为中毒一定会产生明显错误结果。
        - 忘记中毒的时间点会影响哪些能力。
