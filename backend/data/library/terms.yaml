  - id: night
    name: 夜晚
    aliases:
      - 黑天
      - 夜里
      - 夜间
      - 夜晚阶段
      - 每晚
    category: 流程
    summary: 玩家闭眼后由说书人依照夜晚顺序处理角色能力的阶段。
    detail:
      overview: 玩家闭眼后由说书人依照夜晚顺序处理角色能力的阶段。
      howItWorks:
        - 很多角色会在夜晚醒来行动或获得信息。
        - 首夜和其他夜晚的行动顺序可能不同。
        - 夜晚死亡、保护、醉酒、中毒等结果会影响第二天讨论。
      commonMistakes:
        - 把所有死亡都直接归因于恶魔。
        - 忘记首夜与其他夜晚的行动顺序不同。
        - 没有记录夜晚异常，导致白天无法复盘。
      examples:
