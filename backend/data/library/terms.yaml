    category: 流程
    summary: 游戏开始前决定角色分配、额外标记和人数配置调整的阶段。
    detail:
      overview: 游戏开始前决定角色分配、额外标记和人数配置调整的阶段。
      howItWorks:
        - 设置效果通常在玩家拿到角色或首夜开始前完成。
        - 有些角色会改变外来者数量、加入额外角色或影响初始身份。
        - 说书人需要把设置结果记录进魔典，避免夜晚结算时遗漏。
      commonMistakes:
        - 把设置效果拖到游戏开始后才临时决定。
        - 忘记设置类角色可能改变人数配置。
        - 没有记录设置来源，导致后续复盘难以解释。
