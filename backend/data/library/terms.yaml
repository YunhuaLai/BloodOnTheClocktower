    summary: 首夜之后的夜晚，更多持续能力、击杀、保护和信息结算会发生。
    detail:
      overview: 首夜之后的夜晚，更多持续能力、击杀、保护和信息结算会发生。
      howItWorks:
        - 许多持续型角色每个其他夜晚都会行动。
        - 恶魔击杀、保护、醉酒、中毒和死亡触发常在此阶段交错。
        - 每天记录夜晚结果能帮助复盘能力链。
      commonMistakes:
        - 沿用首夜顺序处理后续夜晚。
        - 漏掉死亡触发型角色。
